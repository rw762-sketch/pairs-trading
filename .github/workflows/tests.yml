name: Research checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run research tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Replay official frozen strategy
        run: python main.py --output "$RUNNER_TEMP/pairs-trading-results"
